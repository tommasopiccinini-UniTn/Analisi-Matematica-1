<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="title desc">
<title id="title">Significato grafico di un limite finito per x che tende a più infinito</title>
<desc id="desc">La funzione oscilla prima della soglia K; oltre K rimane tra ell meno epsilon e ell più epsilon, avvicinandosi alla retta orizzontale y uguale ell.</desc>
<defs><pattern id="hatched" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V14" stroke="#7dc6aa" stroke-width="3" opacity=".6"/></pattern></defs>
<rect width="900" height="430" fill="#ffffff"/>
<text x="125" y="42" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#252c41">Limite finito per x → +∞</text>
<text x="125" y="75" font-family="Arial, sans-serif" font-size="17" fill="#535e73">Per ogni ε &gt; 0 esiste K: se x &gt; K, il grafico rimane nella fascia</text>
<rect x="500" y="153" width="360" height="102" fill="url(#hatched)"/>
<line x1="110" y1="338" x2="867" y2="338" stroke="#26313b" stroke-width="2.5"/>
<path d="M867 338 l-10 -6 m10 6 l-10 6" stroke="#26313b" stroke-width="2.5" fill="none"/>
<line x1="110" y1="374" x2="110" y2="99" stroke="#26313b" stroke-width="2.5"/>
<path d="M110 99 l-6 10 m6 -10 l6 10" stroke="#26313b" stroke-width="2.5" fill="none"/>
<line x1="110" y1="153" x2="861" y2="153" stroke="#d88422" stroke-width="2.5" stroke-dasharray="9 7"/>
<line x1="110" y1="204" x2="861" y2="204" stroke="#266dc2" stroke-width="2.5" stroke-dasharray="9 7"/>
<line x1="110" y1="255" x2="861" y2="255" stroke="#d88422" stroke-width="2.5" stroke-dasharray="9 7"/>
<text x="17" y="160" font-family="Arial, sans-serif" font-size="22" fill="#b8660c">ℓ + ε</text>
<text x="70" y="211" font-family="Arial, sans-serif" font-size="22" fill="#266dc2">ℓ</text>
<text x="17" y="262" font-family="Arial, sans-serif" font-size="22" fill="#b8660c">ℓ − ε</text>
<line x1="500" y1="95" x2="500" y2="371" stroke="#804ba6" stroke-width="2.5" stroke-dasharray="10 7"/>
<text x="488" y="365" font-family="Arial, sans-serif" font-size="20" fill="#804ba6">K</text>
<text x="646" y="380" font-family="Arial, sans-serif" font-size="20" fill="#804ba6">x &gt; K</text>
<path d="M110 201 C142 96 160 284 205 214 C250 135 256 99 291 155 C319 206 304 307 353 279 C392 257 365 111 420 158 C459 187 463 219 500 205 C534 186 551 221 586 204 C610 191 627 214 657 203 C692 194 698 211 731 204 C768 198 791 208 819 203 C837 200 848 204 859 204" stroke="#d3444a" stroke-width="4" stroke-linecap="round" fill="none"/>
<text x="808" y="324" font-family="Arial, sans-serif" font-size="18" fill="#26313b">x</text>
</svg>